services:
  app:
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
    image: zhibi-english:local
    restart: unless-stopped
    env_file: .env.runtime
    environment:
      PORT: "9000"
      STUDENT_PROJECT_DATA_DIR: /app/data
    volumes:
      - student-data:/app/data
    expose:
      - "9000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    image: nginx:stable-bookworm
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  student-data:
